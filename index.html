<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="assets/css/fonts.css">
    <style>
        /* @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');  */
        
        body {
            background-color: #2c3e50;
            font-family: 'Press Start 2P', cursive;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url("assets/images/bg.png");
            background-size: cover;
            background-position: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: #f1c40f;
            text-shadow: 4px 4px #c0392b;
            line-height: 1.5;
            text-transform: uppercase;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        button {
            background: #3498db;
            color: white;
            border: 4px solid #2980b9;
            padding: 20px 50px;
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            width: 350px;
            box-shadow: 0 6px 0 #1a5276;
        }

        button:hover {
            background: #2980b9;
            transform: translateY(2px);
            box-shadow: 0 4px 0 #1a5276;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        a { text-decoration: none; }
    </style>
</head>
<body>
    <h1>Teenage Single Parent<br>Life Simulator PH</h1>
    
    <div class="menu-container">
        <a href="assets/html/game.html"><button>START GAME</button></a>
        <a href="assets/html/how-to-play.html"><button>HOW TO PLAY?</button></a>
         <a href="assets/html/character.html"><button>SELECT CHARACTER</button></a>
        <a href="assets/html/education.html"><button>EDUCATION & STATS</button></a>
    </div>
</body>
</html>
